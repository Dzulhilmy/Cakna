services:
  db:
    image: postgres:16-alpine
    container_name: cakna-quran-db
    environment:
      POSTGRES_USER: cakna
      POSTGRES_PASSWORD: cakna
      POSTGRES_DB: cakna
    ports:
      - "54329:5432"
    volumes:
      - cakna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakna -d cakna"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cakna_pgdata:
