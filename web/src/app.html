<!doctype html>
<html lang="ms">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0B3D2E" />
		<meta
			name="description"
			content="Cakna — Mushaf digital 604 halaman dengan tajwid berwarna, audio qari, terjemahan berbilang bahasa, waktu solat, kiblat, zikir & hafazan."
		/>
		<title>Cakna — Mushaf Digital</title>
		<script>
			// Prevent theme flash: apply saved theme before first paint.
			try {
				var s = JSON.parse(localStorage.getItem('cakna:settings') || '{}');
				var t = s.theme === 'dark' || s.theme === 'sepia' ? s.theme : 'light';
				document.documentElement.dataset.theme = t;
				if (t === 'dark') document.documentElement.classList.add('dark');
				if (s.fontSize) document.documentElement.style.setProperty('--arabic-size', s.fontSize + 'px');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
