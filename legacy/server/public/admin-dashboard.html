<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cakna · Panel Admin — Kemajuan Al-Ma'thurat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald-deep:#0B3D2E;
    --emerald:#155B44;
    --emerald-lt:#1F7355;
    --gold:#C7A24B;
    --gold-dk:#B0873A;
    --gold-soft:#E3CD96;
    --bg:#F7F3E8;
    --surface:#FFFDF7;
    --surface-2:#FBF7EC;
    --text:#22312B;
    --text-soft:#5C6B63;
    --border:#E4DCC8;
    --border-2:#EFE8D6;
    --amber:#C67A2E;
    --shadow-sm:0 1px 2px rgba(11,61,46,.05), 0 6px 18px rgba(11,61,46,.05);
    --shadow-md:0 2px 6px rgba(11,61,46,.06), 0 18px 40px rgba(11,61,46,.09);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Figtree',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--gold-soft);color:var(--emerald-deep)}
  h1,h2,h3,h4{font-weight:400;line-height:1.2}
  .serif{font-family:'Marcellus',serif;font-weight:400}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  svg{display:block}
  a{color:inherit;text-decoration:none}

  /* ============ APP SHELL ============ */
  .app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}

  /* ============ SIDEBAR ============ */
  .sidebar{
    background:
      radial-gradient(120% 70% at 100% 0%, rgba(199,162,75,.10), transparent 55%),
      linear-gradient(180deg,#0B3D2E 0%,#0A3628 100%);
    color:#EDE9DB;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    border-right:1px solid rgba(199,162,75,.16);
  }
  .brand{
    display:flex;align-items:center;gap:12px;
    padding:22px 20px 20px;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .brand-mark{
    width:44px;height:44px;flex:none;display:grid;place-items:center;
    color:var(--gold);
    background:rgba(199,162,75,.08);
    border:1px solid rgba(199,162,75,.28);
    border-radius:13px;
  }
  .brand-mark svg{width:30px;height:30px}
  .brand h1{font-family:'Marcellus',serif;font-size:21px;letter-spacing:.05em;color:#FBF7EC}
  .brand p{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft);margin-top:2px}

  .nav{flex:1;overflow-y:auto;padding:16px 12px}
  .nav-label{
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(227,205,150,.62);
    padding:12px 12px 8px;
  }
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:11px 12px;border-radius:11px;margin-bottom:2px;
    color:rgba(237,233,219,.78);font-size:14px;font-weight:500;
    letter-spacing:.01em;position:relative;
    transition:background .18s,color .18s;
  }
  .nav-item svg{width:19px;height:19px;flex:none;opacity:.9}
  .nav-item:hover{background:rgba(255,255,255,.055);color:#FBF7EC}
  .nav-item.active{
    background:linear-gradient(90deg,rgba(199,162,75,.20),rgba(199,162,75,.05));
    color:#FBF7EC;
  }
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
    background:var(--gold);border-radius:0 3px 3px 0;
  }
  .nav-item .badge{
    margin-left:auto;font-size:10.5px;font-weight:700;
    background:var(--gold);color:var(--emerald-deep);
    border-radius:20px;padding:1px 8px;letter-spacing:.02em;
  }
  .nav-item.active .badge{background:var(--gold)}

  .side-foot{
    padding:14px 12px;border-top:1px solid rgba(255,255,255,.07);
  }
  .admin-card{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;
    background:rgba(255,255,255,.04);
  }
  .admin-card .av{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--gold),var(--gold-dk));
    color:var(--emerald-deep);display:grid;place-items:center;
    font-family:'Marcellus',serif;font-size:16px;
  }
  .admin-card .nm{font-size:13px;font-weight:600;color:#FBF7EC}
  .admin-card .rl{font-size:11px;color:rgba(227,205,150,.7)}
  .admin-card .cog{margin-left:auto;color:rgba(237,233,219,.5)}

  /* ============ MAIN ============ */
  .main{min-width:0;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:22px 34px 18px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 78%,rgba(247,243,232,0));
  }
  .topbar .tt{flex:1;min-width:0}
  .topbar h2{font-family:'Marcellus',serif;font-size:27px;letter-spacing:.01em}
  .topbar .sub{color:var(--text-soft);font-size:13.5px;margin-top:3px}
  .searchbox{
    display:flex;align-items:center;gap:9px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:0 13px;height:42px;width:250px;
    box-shadow:var(--shadow-sm);
  }
  .searchbox svg{width:17px;height:17px;color:var(--text-soft);flex:none}
  .searchbox input{border:none;background:none;outline:none;font-size:13.5px;width:100%;color:var(--text)}
  .searchbox input::placeholder{color:var(--text-soft)}
  .date-pill{
    display:flex;align-items:center;gap:8px;height:42px;padding:0 15px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    font-size:13px;font-weight:500;color:var(--text-soft);white-space:nowrap;
    box-shadow:var(--shadow-sm);
  }
  .date-pill svg{width:16px;height:16px;color:var(--gold-dk)}
  .icon-btn{
    width:42px;height:42px;flex:none;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    color:var(--text-soft);box-shadow:var(--shadow-sm);position:relative;
  }
  .icon-btn svg{width:18px;height:18px}
  .icon-btn .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--gold);border:1.5px solid var(--surface)}

  .content{padding:6px 34px 40px;display:flex;flex-direction:column;gap:22px}

  /* ============ KPI CARDS ============ */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:17px;
    padding:19px 20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  }
  .kpi::after{
    content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle,rgba(199,162,75,.07),transparent 70%);
  }
  .kpi .k-top{display:flex;align-items:center;gap:11px;margin-bottom:15px}
  .kpi .k-ic{
    width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(21,91,68,.10),rgba(21,91,68,.04));
    border:1px solid rgba(21,91,68,.14);color:var(--emerald);
  }
  .kpi .k-ic svg{width:20px;height:20px}
  .kpi.gold .k-ic{
    background:linear-gradient(135deg,rgba(199,162,75,.16),rgba(199,162,75,.05));
    border-color:rgba(199,162,75,.32);color:var(--gold-dk);
  }
  .kpi .k-label{font-size:12px;color:var(--text-soft);letter-spacing:.02em;font-weight:500}
  .kpi .k-num{font-family:'Marcellus',serif;font-size:31px;line-height:1;letter-spacing:.01em}
  .kpi .k-foot{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12px;color:var(--text-soft)}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:20px}
  .delta svg{width:11px;height:11px}
  .delta.up{color:#1c7a54;background:rgba(31,115,85,.11)}
  .delta.flat{color:var(--text-soft);background:rgba(92,107,99,.09)}

  /* ============ GRID ============ */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    box-shadow:var(--shadow-sm);overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:18px 20px;border-bottom:1px solid var(--border-2);
  }
  .card-head h3{font-family:'Marcellus',serif;font-size:18px}
  .card-head .ch-sub{font-size:12.5px;color:var(--text-soft);margin-top:2px}
  .chips{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .chip{
    font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;
    border:1px solid var(--border);color:var(--text-soft);background:var(--surface);
    transition:.15s;
  }
  .chip.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .chip:hover:not(.on){border-color:var(--gold);color:var(--gold-dk)}

  /* ============ USERS TABLE ============ */
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--text-soft);font-weight:700;padding:13px 18px;
    background:var(--surface-2);border-bottom:1px solid var(--border-2);white-space:nowrap;
  }
  thead th:last-child{text-align:center;width:44px}
  .u-row{border-bottom:1px solid var(--border-2);transition:background .14s}
  .u-row td{padding:13px 18px;vertical-align:middle}
  .u-row.clickable{cursor:pointer}
  .u-row.clickable:hover{background:var(--surface-2)}
  .u-row.selected{background:linear-gradient(90deg,rgba(199,162,75,.09),rgba(199,162,75,.02))}
  .u-row.selected td:first-child{box-shadow:inset 3px 0 0 var(--gold)}

  .u-cell{display:flex;align-items:center;gap:12px;min-width:180px}
  .av{
    width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
    font-family:'Marcellus',serif;font-size:16px;color:#FBF7EC;letter-spacing:.02em;
  }
  .u-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.25}
  .u-mail{font-size:12px;color:var(--text-soft)}

  .badge-login{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap;
  }
  .badge-login svg{width:13px;height:13px}
  .badge-login.sso{background:rgba(21,91,68,.10);color:var(--emerald);border:1px solid rgba(21,91,68,.18)}
  .badge-login.email{background:rgba(92,107,99,.08);color:var(--text-soft);border:1px solid var(--border)}

  .last-active{font-size:13px;color:var(--text);white-space:nowrap}
  .last-active .lo{display:block;font-size:11px;color:var(--text-soft)}
  .la-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .la-dot.on{background:#2aa06e;box-shadow:0 0 0 3px rgba(42,160,110,.16)}
  .la-dot.off{background:var(--border)}

  .prog-cell{min-width:150px}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .prog-top .pv{font-size:13px;font-weight:700;color:var(--text)}
  .prog-top .pl{font-size:10.5px;color:var(--text-soft)}
  .bar{height:6px;border-radius:4px;background:var(--border);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--emerald),var(--gold))}

  .streak-cell{white-space:nowrap}
  .streak{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text)}
  .streak svg{width:15px;height:15px;color:var(--gold-dk)}
  .streak.zero{color:var(--text-soft)}
  .streak.zero svg{color:var(--border)}
  .streak small{font-weight:500;color:var(--text-soft);font-size:11px}

  .chev{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text-soft);margin:0 auto;transition:.2s}
  .chev svg{width:16px;height:16px}
  .u-row.selected .chev{transform:rotate(180deg);color:var(--gold-dk);background:rgba(199,162,75,.12)}

  /* ============ DETAIL PANEL ============ */
  .detail-row > td{padding:0;background:var(--surface-2)}
  .detail-wrap{display:none;padding:6px 20px 24px}
  .detail-row.open .detail-wrap{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  .detail-head{display:flex;align-items:center;gap:11px;padding:14px 2px 16px}
  .detail-head .dh-star{color:var(--gold)}
  .detail-head .dh-star svg{width:20px;height:20px}
  .detail-head h4{font-family:'Marcellus',serif;font-size:17px}
  .detail-head .dh-sub{font-size:12px;color:var(--text-soft)}
  .detail-head .dh-tag{
    margin-left:auto;font-size:11px;font-weight:600;color:var(--emerald);
    background:rgba(21,91,68,.09);border:1px solid rgba(21,91,68,.16);
    padding:5px 11px;border-radius:20px;
  }

  .mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
  .mode-card{
    background:var(--surface);border:1px solid var(--border);border-radius:15px;
    padding:15px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0;
  }
  .mode-card .mc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .mode-card .mc-mode{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.2}
  .mode-card .mc-sess{font-size:11.5px;color:var(--text-soft);margin-top:1px}
  .mode-card .mc-items{
    font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--gold-dk);
    background:rgba(199,162,75,.12);border-radius:6px;padding:3px 6px;white-space:nowrap;
  }
  .ring-wrap{display:flex;align-items:center;gap:13px}
  .ring{position:relative;width:64px;height:64px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .rv{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:'Marcellus',serif;font-size:17px;color:var(--text);
  }
  .ring .rv small{font-size:9px}
  .mc-stats{display:flex;flex-direction:column;gap:5px;font-size:11.5px;flex:1;min-width:0}
  .mc-stats .st{display:flex;justify-content:space-between;gap:6px}
  .mc-stats .st span{color:var(--text-soft)}
  .mc-stats .st b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  .status{font-size:11px;font-weight:700;padding:5px 0;border-radius:8px;text-align:center;letter-spacing:.02em}
  .status.done{color:var(--emerald);background:rgba(21,91,68,.10)}
  .status.prog{color:var(--gold-dk);background:rgba(199,162,75,.14)}
  .status.idle{color:var(--text-soft);background:rgba(92,107,99,.08)}
  .status.stall{color:var(--amber);background:rgba(198,122,46,.11)}

  .detail-lower{display:grid;grid-template-columns:1fr 1.35fr;gap:13px;margin-top:13px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px}
  .panel .p-lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-soft);font-weight:700;margin-bottom:12px}

  .streak-big{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .streak-big .sb-flame{
    width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(199,162,75,.20),rgba(199,162,75,.06));
    border:1px solid rgba(199,162,75,.3);color:var(--gold-dk);
  }
  .streak-big .sb-flame svg{width:24px;height:24px}
  .streak-big .sb-n{font-family:'Marcellus',serif;font-size:30px;line-height:1}
  .streak-big .sb-u{font-size:12px;color:var(--text-soft)}
  .dots{display:flex;gap:5px;flex-wrap:wrap}
  .dots i{width:17px;height:17px;border-radius:6px;flex:none;background:var(--border);position:relative}
  .dots i.on{background:linear-gradient(135deg,var(--emerald),var(--emerald-lt))}
  .dots i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
  .dots-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-soft);margin-top:9px}

  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .meta{padding:11px 13px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:12px}
  .meta .m-l{font-size:11px;color:var(--text-soft);display:flex;align-items:center;gap:6px}
  .meta .m-l svg{width:13px;height:13px;color:var(--gold-dk)}
  .meta .m-v{font-family:'Marcellus',serif;font-size:19px;margin-top:4px}
  .meta .m-v small{font-family:'Figtree';font-size:12px;color:var(--text-soft);font-weight:500}

  /* ============ RIGHT RAIL ============ */
  .rail{display:flex;flex-direction:column;gap:22px}
  .rail .card-head{padding:16px 18px}

  .chart-body{padding:18px}
  .bars{display:flex;align-items:flex-end;justify-content:space-between;gap:9px;height:132px}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bstack{width:60%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .bstack .bp{background:linear-gradient(180deg,var(--emerald-lt),var(--emerald))}
  .bstack .be{background:linear-gradient(180deg,var(--gold-soft),var(--gold))}
  .bcol .bd{font-size:10.5px;color:var(--text-soft);font-weight:600}
  .bcol.peak .bd{color:var(--gold-dk)}
  .legend{display:flex;gap:16px;padding:14px 18px 0;font-size:12px;color:var(--text-soft)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .legend .lp{background:var(--emerald)}
  .legend .le{background:var(--gold)}

  .split{padding:18px;display:flex;flex-direction:column;gap:16px}
  .split-row .sr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .split-row .sr-l{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .split-row .sr-l svg{width:15px;height:15px}
  .split-row .sr-n{font-size:12.5px;color:var(--text-soft)}
  .split-row .sr-n b{color:var(--text);font-weight:700}
  .split-row.sso .sr-l{color:var(--emerald)}
  .split-row .track{height:9px;border-radius:5px;background:var(--border);overflow:hidden}
  .split-row.sso .track > i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--emerald-lt))}
  .split-row.email .track > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold))}

  .rank{padding:8px 8px 14px}
  .rank-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px}
  .rank-item:hover{background:var(--surface-2)}
  .rank-item .rk{
    width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;
    font-family:'Marcellus',serif;font-size:13px;color:var(--text-soft);
    background:var(--surface-2);border:1px solid var(--border-2);
  }
  .rank-item:nth-child(1) .rk{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#fff;border-color:transparent}
  .rank-item .r-nm{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-item .r-st{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--gold-dk)}
  .rank-item .r-st svg{width:13px;height:13px}

  .footer{padding:8px 34px 26px;color:var(--text-soft);font-size:11.5px;display:flex;gap:8px;align-items:center;justify-content:center}
  .footer .fstar{color:var(--gold)}
  .footer .fstar svg{width:14px;height:14px}

  /* ============ RESPONSIVE ============ */
  @media (max-width:1100px){
    .grid{grid-template-columns:1fr}
    .rail{flex-direction:row;flex-wrap:wrap}
    .rail > .card{flex:1;min-width:280px}
    .mode-grid{grid-template-columns:repeat(2,1fr)}
    .detail-lower{grid-template-columns:1fr}
  }
  @media (max-width:900px){

    // ---------- inline SVG snippets (copied from the mockup) ----------
    var SVG = {

      flame2: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 9 12 6 12 2z"/><path d="M12 22a6 6 0 0 0 6-6c0-3-2-5-3.5-6.5.5 2-1 3.5-2.5 3.5s-2.5-1.5-2-3.5C8 11 6 13 6 16a6 6 0 0 0 6 6z" opacity=".55"/></svg>',
      flame1: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 9 12 6 12 2z"/></svg>',
      flameBig: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c1 3 4 4 4 8a4 4 0 0 1-8 0c0-1 .5-2 1-2.5C9 9 12 6 12 2z"/><path d="M12 22a6 6 0 0 0 6-6c0-3-2-5-3.5-6.5.5 2-1 3.5-2.5 3.5s-2.5-1.5-2-3.5C8 11 6 13 6 16a6 6 0 0 0 6 6z" opacity=".5"/></svg>',
      chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
      star: '<svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2 l5.9 8.2 9.6 2.4 -6.2 7.7 .7 9.9 -10 -3.7 -10 3.7 .7 -9.9 -6.2 -7.7 9.6 -2.4 Z"/><circle cx="22" cy="18" r="5.5"/></svg>',
      metaSync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 21 6.5 17 10.5M21 6.5H7a4 4 0 0 0-4 4M7 21.5 3 17.5 7 13.5M3 17.5h14a4 4 0 0 0 4-4"/></svg>',
      metaAct: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 5 14 2.5-7H21"/></svg>',
      metaClock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>',
      metaChart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 2 4-6"/></svg>',
      kUsers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M17.5 19a5.2 5.2 0 0 0-3-4.7"/></svg>',
      kAct: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 5 14 2.5-7H21"/></svg>',
      kTarget: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v4.5M12 16.5V21M3 12h4.5M16.5 12H21"/></svg>',
      kSync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 21 6.5 17 10.5"/><path d="M21 6.5H7a4 4 0 0 0-4 4v.5"/><path d="M7 21.5 3 17.5 7 13.5"/><path d="M3 17.5h14a4 4 0 0 0 4-4V13"/></svg>'
    };

    // ---------- helpers ----------
    var GRADS = [
      'linear-gradient(135deg,#155B44,#0B3D2E)',
      'linear-gradient(135deg,#1F7355,#155B44)',
      'linear-gradient(135deg,#B0873A,#8A6522)',
      'linear-gradient(135deg,#5C6B63,#3F4B45)'
    ];
    function grad(key){
      var h = 0, i; key = String(key || '');
      for(i = 0; i < key.length; i++){ h = (h * 31 + key.charCodeAt(i)) >>> 0; }
      return GRADS[h % GRADS.length];
    }
    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
      });
    }
    function clampPct(n){ n = Number(n) || 0; if(n < 0) n = 0; if(n > 100) n = 100; return Math.round(n); }
    function nf(n){ n = Number(n) || 0; return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function verLabel(v){ return v === 'kubra' ? 'Kubra' : 'Sughra'; }
    function modeLabel(m){ return m === 'petang' ? 'Petang' : 'Pagi'; }

    var MONTHS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
    var MONS   = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
    function fmtStamp(iso){
      var d = new Date(iso); if(isNaN(d.getTime())) return '';
      var h = d.getHours(), m = d.getMinutes();
      var part = h < 12 ? 'pagi' : (h < 15 ? 'tengah hari' : (h < 19 ? 'petang' : 'malam'));
      var hh = h % 12; if(hh === 0) hh = 12;
      var mm = (m < 10 ? '0' : '') + m;
      return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hh + ':' + mm + ' ' + part;
    }
    function dotDate(daysAgo){
      var base = state.ref ? new Date(state.ref) : new Date();
      base.setDate(base.getDate() - daysAgo);
      return base.getDate() + ' ' + MONS[base.getMonth()];
    }

    // ---------- app state ----------
    var state = { data: null, roles: null, view: 'dashboard', filter: 'all', search: '', selectedId: null, ref: null };

    // ---------- KPI row ----------
    function kpiSection(k, data){
      var actPct = k.total_users ? Math.round((k.active_today / k.total_users) * 100) : 0;
      var sumP = 0, sumE = 0;
      (data.weekly || []).forEach(function(w){ sumP += w.pagi || 0; sumE += w.petang || 0; });
      return '<section class="kpis">'
        + kpiCard('', SVG.kUsers, 'Jumlah Pengguna', nf(k.total_users), 'Pengguna berdaftar')
        + kpiCard('', SVG.kAct, 'Aktif Hari Ini', nf(k.active_today), actPct + '% daripada semua pengguna')
        + kpiCard('gold', SVG.kTarget, "Purata Kemajuan Ma'thurat", clampPct(k.avg_completion) + '%', 'Min. Sughra &amp; Kubra')
        + kpiCard('gold', SVG.kSync, 'Sesi Wirid Minggu Ini', nf(k.sessions_week), 'Pagi ' + nf(sumP) + ' · Petang ' + nf(sumE))
        + '</section>';
    }
    function kpiCard(mod, icon, label, num, foot){
      return '<div class="kpi' + (mod ? ' ' + mod : '') + '">'
        + '<div class="k-top"><div class="k-ic">' + icon + '</div><div class="k-label">' + label + '</div></div>'
        + '<div class="k-num">' + num + '</div>'
        + '<div class="k-foot">' + foot + '</div>'
        + '</div>';
    }

    // ---------- main grid ----------
    function gridSection(data){
      return '<section class="grid">' + tableCard() + railCard(data) + '</section>';
    }

    function tableCard(){
      return '<div class="card">'
        + '<div class="card-head">'
          + '<div><h3>Pengguna &amp; Kemajuan Ma\'thurat</h3>'
          + '<div class="ch-sub">Klik mana-mana baris untuk lihat butiran penuh Sughra / Kubra</div></div>'
          + '<div class="chips">'
            + '<button class="chip on" data-filter="all">Semua</button>'
            + '<button class="chip" data-filter="qcxis">QCXIS SSO</button>'
            + '<button class="chip" data-filter="email">E-mel</button>'
          + '</div>'
        + '</div>'
        + '<div class="table-scroll"><table>'
          + '<thead><tr><th>Pengguna</th><th>Log Masuk</th><th>Aktif Terakhir</th><th>Kemajuan Ma\'thurat</th><th>Streak</th><th></th></tr></thead>'
          + '<tbody id="u-body"></tbody>'
        + '</table></div>'
        + '</div>';
    }

    // ---------- right rail ----------
    function railCard(data){
      return '<aside class="rail">'
        + weeklyCard(data.weekly || [])
        + splitCard(data.login_split || {})
        + rankCard(data.streak_leaders || [])
        + '</aside>';
    }

    function weeklyCard(weekly){
      var MAXPX = 106;
      var totals = weekly.map(function(w){ return (w.pagi || 0) + (w.petang || 0); });
      var max = Math.max.apply(null, totals.concat([1]));
      var peaked = false;
      var bars = weekly.map(function(w){
        var scale = MAXPX / max;
        var p = Math.round((w.pagi || 0) * scale);
        var e = Math.round((w.petang || 0) * scale);
        if((w.pagi || 0) > 0 && p < 3) p = 3;
        if((w.petang || 0) > 0 && e < 3) e = 3;
        var isPeak = !peaked && ((w.pagi || 0) + (w.petang || 0)) === max;
        if(isPeak) peaked = true;
        return '<div class="bcol' + (isPeak ? ' peak' : '') + '"><div class="bstack">'
          + '<div class="bp" style="height:' + p + 'px"></div>'
          + '<div class="be" style="height:' + e + 'px"></div>'
          + '</div><div class="bd">' + esc(w.day) + '</div></div>';
      }).join('');
      return '<div class="card">'
        + '<div class="card-head"><div><h3>Sesi Wirid — 7 Hari</h3><div class="ch-sub">Pagi vs Petang</div></div></div>'
        + '<div class="legend"><span><i class="lp"></i>Wirid Pagi</span><span><i class="le"></i>Wirid Petang</span></div>'
        + '<div class="chart-body"><div class="bars">' + bars + '</div></div>'
        + '</div>';
    }

    function splitCard(sp){
      var q = sp.qcxis || 0, e = sp.email || 0, tot = q + e;
      var qp = tot ? Math.round((q / tot) * 100) : 0;
      var ep = tot ? 100 - qp : 0;
      return '<div class="card">'
        + '<div class="card-head"><div><h3>Kaedah Log Masuk</h3><div class="ch-sub">' + nf(tot) + ' pengguna berdaftar</div></div></div>'
        + '<div class="split">'
          + '<div class="split-row sso"><div class="sr-top"><span class="sr-l">' + SVG.sso + 'QCXIS SSO</span>'
            + '<span class="sr-n"><b>' + nf(q) + '</b> · ' + qp + '%</span></div>'
            + '<div class="track"><i style="width:' + qp + '%"></i></div></div>'
          + '<div class="split-row email"><div class="sr-top"><span class="sr-l" style="color:var(--gold-dk)">' + SVG.mail + 'E-mel &amp; Kata Laluan</span>'
            + '<span class="sr-n"><b>' + nf(e) + '</b> · ' + ep + '%</span></div>'
            + '<div class="track"><i style="width:' + ep + '%"></i></div></div>'
        + '</div>'
        + '</div>';
    }

    function rankCard(leaders){
      var items = leaders.map(function(l, i){
        return '<div class="rank-item">'
          + '<div class="rk">' + (i + 1) + '</div>'
          + '<div class="av" style="width:30px;height:30px;border-radius:9px;font-size:12px;background:' + grad(l.name) + '">' + esc(l.initials) + '</div>'
          + '<div class="r-nm">' + esc(l.name) + '</div>'
          + '<div class="r-st">' + SVG.flame1 + esc(l.streak) + '</div>'
          + '</div>';
      }).join('');
      return '<div class="card">'
        + '<div class="card-head"><div><h3>Ranking Streak Tertinggi</h3><div class="ch-sub">Hari berturut terpanjang</div></div></div>'
        + '<div class="rank">' + (items || '<div style="padding:14px 10px;color:var(--text-soft);font-size:12.5px">Tiada rekod streak.</div>') + '</div>'
        + '</div>';
    }

    // ---------- users table rows + detail ----------
    function loginBadge(m){
      if(m === 'qcxis') return '<span class="badge-login sso">' + SVG.sso + 'QCXIS SSO</span>';
      return '<span class="badge-login email">' + SVG.mail + 'E-mel</span>';
    }

    function userRowsHtml(users, selId, refNow){
      return users.map(function(u){
        var sel = (u.id === selId);
        var recent = (refNow && u.last_active_iso) ? (refNow - new Date(u.last_active_iso).getTime()) < (2 * 3600 * 1000) : false;
        var zero = (Number(u.streak) === 0) ? ' zero' : '';
        var p = clampPct(u.headline_pct);
        var row = '<tr class="u-row clickable' + (sel ? ' selected' : '') + '" data-id="' + u.id + '">'
          + '<td><div class="u-cell"><div class="av" style="background:' + grad(u.name) + '">' + esc(u.initials) + '</div>'
            + '<div><div class="u-name">' + esc(u.name) + '</div><div class="u-mail">' + esc(u.email) + '</div></div></div></td>'
          + '<td>' + loginBadge(u.login_method) + '</td>'
          + '<td><div class="last-active"><span class="la-dot ' + (recent ? 'on' : 'off') + '"></span>' + esc(u.last_active_label)
            + '<span class="lo">Wirid ' + modeLabel(u.mode) + '</span></div></td>'
          + '<td><div class="prog-cell"><div class="prog-top"><span class="pv">' + p + '%</span>'
            + '<span class="pl">' + verLabel(u.version) + '</span></div>'
            + '<div class="bar"><i style="width:' + p + '%"></i></div></div></td>'
          + '<td class="streak-cell"><span class="streak' + zero + '">' + SVG.flame2 + esc(u.streak) + ' <small>hari</small></span></td>'
          + '<td><div class="chev">' + SVG.chev + '</div></td>'
          + '</tr>';
        var detail = '<tr class="detail-row' + (sel ? ' open' : '') + '"><td colspan="6">' + (sel ? detailHtml(u) : '') + '</td></tr>';
        return row + detail;
      }).join('');
    }

    function ring(p){
      var C = 163.36;
      var v = clampPct(p);
      var off = (C * (1 - v / 100)).toFixed(2);
      var zeroStyle = v === 0 ? ' style="color:var(--text-soft)"' : '';
      return '<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64">'
        + '<circle cx="32" cy="32" r="26" fill="none" stroke="#E4DCC8" stroke-width="6"/>'
        + '<circle cx="32" cy="32" r="26" fill="none" stroke="#C7A24B" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="' + off + '"/>'
        + '</svg><div class="rv"' + zeroStyle + '>' + v + '<small>%</small></div></div>';
    }

    function doneBadge(label, done){
      return done
        ? '<div class="status done" style="flex:1">' + label + ' ✓</div>'
        : '<div class="status idle" style="flex:1">' + label + ' ✕</div>';
    }

    function modeCard(name, m){
      m = m || {};
      return '<div class="mode-card">'
        + '<div class="mc-top"><div><div class="mc-mode">' + name + '</div><div class="mc-sess">Wirid harian</div></div>'
          + '<span class="mc-items">' + (Number(m.items) || 0) + ' item</span></div>'
        + '<div class="ring-wrap">' + ring(m.pct)
          + '<div class="mc-stats">'
            + '<div class="st"><span>Ulangan</span><b>' + (Number(m.reps) || 0) + ' / ' + (Number(m.target) || 0) + '</b></div>'
            + '<div class="st"><span>Item</span><b>' + (Number(m.item) || 0) + ' / ' + (Number(m.items) || 0) + '</b></div>'
          + '</div>'
        + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:auto">' + doneBadge('Pagi', m.pagi) + doneBadge('Petang', m.petang) + '</div>'
        + '</div>';
    }

    function metaBox(icon, label, valueHtml, vstyle){
      return '<div class="meta"><div class="m-l">' + icon + label + '</div>'
        + '<div class="m-v"' + (vstyle ? ' style="' + vstyle + '"' : '') + '>' + valueHtml + '</div></div>';
    }

    function detailHtml(u){
      var d = u.detail || {};
      var s = d.sughra || {}, k = d.kubra || {};
      var heat = d.heatmap || [];
      var activeCount = heat.filter(Boolean).length;
      var tu = d.total_ulangan || {};
      var avgDay = ((Number(d.sessions_month) || 0) / 30).toFixed(1);

      var dots = heat.map(function(on, i){
        var today = (i === heat.length - 1);
        var cls = (on ? 'on' : '') + (today ? ' today' : '');
        cls = cls.trim();
        var title = today ? 'Hari ini' : dotDate(heat.length - 1 - i);
        return '<i' + (cls ? ' class="' + cls + '"' : '') + ' title="' + title + '"></i>';
      }).join('');

      return '<div class="detail-wrap">'
        + '<div class="detail-head"><span class="dh-star">' + SVG.star + '</span>'
          + '<div><h4>Butiran Kemajuan Al-Ma\'thurat</h4>'
          + '<div class="dh-sub">' + esc(u.name) + ' · pecahan mengikut mod &amp; sesi</div></div>'
          + '<div class="dh-tag">' + verLabel(d.version) + ' · Wirid ' + modeLabel(d.mode) + '</div></div>'
        + '<div class="mode-grid">' + modeCard('Sughra', s) + modeCard('Kubra', k) + '</div>'
        + '<div class="detail-lower">'
          + '<div class="panel"><div class="p-lab">Konsistensi Harian</div>'
            + '<div class="streak-big"><div class="sb-flame">' + SVG.flameBig + '</div>'
              + '<div><div class="sb-n">' + esc(d.streak) + ' <span style="font-family:Figtree;font-size:14px;color:var(--text-soft)">hari berturut</span></div>'
              + '<div class="sb-u">' + activeCount + ' / ' + (heat.length || 14) + ' hari aktif dua minggu ini</div></div></div>'
            + '<div class="dots">' + dots + '</div>'
            + '<div class="dots-cap"><span>14 hari lepas</span><span>Hari ini</span></div>'
          + '</div>'
          + '<div class="panel"><div class="p-lab">Ringkasan Bulan Ini</div>'
            + '<div class="meta-grid">'
              + metaBox(SVG.metaSync, 'Sesi selesai', nf(d.sessions_month || 0) + ' <small>sesi</small>')
              + metaBox(SVG.metaAct, 'Purata / hari', avgDay + ' <small>sesi</small>')
              + metaBox(SVG.metaClock, 'Terakhir selesai', esc(d.last_completed_label || '—'), 'font-size:15px')
              + metaBox(SVG.metaChart, 'Jumlah ulangan', (Number(tu.done) || 0) + ' <small>/ ' + (Number(tu.target) || 0) + '</small>', 'font-size:16px')
            + '</div>'
          + '</div>'
        + '</div>'
      + '</div>';
    }

    // ---------- filtering / selection ----------
    function currentUsers(){
      var us = (state.data && state.data.users) || [];
      if(state.filter === 'qcxis') us = us.filter(function(u){ return u.login_method === 'qcxis'; });
      else if(state.filter === 'email') us = us.filter(function(u){ return u.login_method === 'email'; });
      var s = (state.search || '').trim().toLowerCase();
      if(s) us = us.filter(function(u){
        return String(u.name || '').toLowerCase().indexOf(s) > -1 || String(u.email || '').toLowerCase().indexOf(s) > -1;
      });
      return us;
    }

    function renderTable(){
      var body = document.getElementById('u-body');
      if(!body) return;
      var us = currentUsers();
      var ids = us.map(function(u){ return u.id; });
      if(ids.indexOf(state.selectedId) === -1){ state.selectedId = us.length ? us[0].id : null; }
      if(!us.length){
        body.innerHTML = '<tr><td colspan="6" style="padding:28px 18px;text-align:center;color:var(--text-soft)">Tiada pengguna untuk penapis ini.</td></tr>';
        return;
      }
      var refNow = state.ref ? new Date(state.ref).getTime() : Date.now();
      body.innerHTML = userRowsHtml(us, state.selectedId, refNow);
      body.querySelectorAll('tr.u-row.clickable').forEach(function(row){
        row.addEventListener('click', function(){
          var id = Number(row.getAttribute('data-id'));
          if(id === state.selectedId) return;
          state.selectedId = id;
          renderTable();
        });
      });
    }

    function wireChips(){
      content.querySelectorAll('.chip').forEach(function(chip){
        chip.addEventListener('click', function(){
          content.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
          chip.classList.add('on');
          state.filter = chip.getAttribute('data-filter') || 'all';
          renderTable();
        });
      });
    }

    function updateFooter(iso){
      var f = document.querySelector('.footer');
      if(!f) return;
      var stamp = fmtStamp(iso);
      f.innerHTML = '<span class="fstar"><svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 l5.9 8.2 9.6 2.4 -6.2 7.7 .7 9.9 -10 -3.7 -10 3.7 .7 -9.9 -6.2 -7.7 9.6 -2.4 Z"/></svg></span>'
        + 'Cakna · Panel Admin — Data langsung Al-Ma\'thurat.' + (stamp ? ' Dikemas kini: ' + stamp + '.' : '');
    }

    // ---------- role management ----------
    var roleFlash = null;   // message to show after the next render (survives reload)

    function initialsOf(u){
      var s = (u.name && u.name.trim())
        ? u.name.trim().split(/\s+/).slice(0, 2).map(function(w){ return w[0]; }).join('')
        : ((u.email || '?')[0]);
      return String(s).toUpperCase();
    }

    function rolesCard(rd){
      rd = rd || { users: [], me: null };
      var rows = (rd.users || []).map(function(u){
        var isMe = (u.id === rd.me);
        var pill = u.effective_admin
          ? '<span class="role-pill admin">Admin</span>'
          : '<span class="role-pill user">Pengguna</span>';
        var action;
        if(isMe){
          action = '<span class="role-self">Akaun anda</span>';
        } else if(u.allowlisted && !u.is_admin){
          action = '<span class="role-note" title="Pentadbir melalui ADMIN_EMAILS (tetapan pelayan)">Admin (tetapan)</span>';
        } else if(u.is_admin){
          action = '<button class="role-btn revoke" data-uid="' + u.id + '" data-make="0">Tarik Admin</button>';
        } else {
          action = '<button class="role-btn grant" data-uid="' + u.id + '" data-make="1">Jadikan Admin</button>';
        }
        return '<tr>'
          + '<td><div class="u-cell"><div class="av" style="background:' + grad(u.name || u.email) + '">' + esc(initialsOf(u)) + '</div>'
            + '<div><div class="u-name">' + esc(u.name || u.email) + '</div><div class="u-mail">' + esc(u.email) + '</div></div></div></td>'
          + '<td>' + loginBadge(u.login_method) + '</td>'
          + '<td>' + pill + '</td>'
          + '<td style="text-align:right">' + action + '</td>'
          + '</tr>';
      }).join('');
      return '<section class="roles-sec"><div class="card">'
        + '<div class="card-head"><div><h3>Pengurusan Peranan</h3>'
          + '<div class="ch-sub">Lantik atau tarik balik akses pentadbir — untuk pengguna QCXIS SSO &amp; e-mel</div></div></div>'
        + '<div id="role-msg" class="role-msg" style="display:none"></div>'
        + '<div class="table-scroll"><table>'
          + '<thead><tr><th>Pengguna</th><th>Log Masuk</th><th>Peranan</th><th style="text-align:right">Tindakan</th></tr></thead>'
          + '<tbody>' + (rows || '<tr><td colspan="4" style="padding:24px 18px;text-align:center;color:var(--text-soft)">Tiada pengguna.</td></tr>') + '</tbody>'
        + '</table></div>'
        + '</div></section>';
    }

    function showRoleMsg(text, isErr){
      var m = document.getElementById('role-msg');
      if(!m) return;
      m.textContent = text;
      m.className = 'role-msg ' + (isErr ? 'err' : 'ok');
      m.style.display = 'block';
    }

    function wireRoles(){
      content.querySelectorAll('.role-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var uid = Number(btn.getAttribute('data-uid'));
          var make = btn.getAttribute('data-make') === '1';
          btn.disabled = true; btn.textContent = '…';
          fetch('/api/admin/set-role', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ user_id: uid, make_admin: make })
          })
          .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
          .then(function(res){
            if(!res.ok){ roleFlash = { text: (res.j && res.j.error) || 'Gagal menukar peranan.', err: true }; }
            else { roleFlash = { text: (make ? 'Dilantik sebagai pentadbir.' : 'Akses pentadbir ditarik balik.') + (res.j && res.j.note ? ' ' + res.j.note : ''), err: false }; }
            load();
          })
          .catch(function(){ roleFlash = { text: 'Ralat sambungan.', err: true }; load(); });
        });
      });
    }

    // replace the placeholder sidebar identity with the real signed-in admin
    function updateAdminIdentity(rd){
      if(!rd || !rd.me || !rd.users) return;
      var me = null;
      for(var i = 0; i < rd.users.length; i++){ if(rd.users[i].id === rd.me){ me = rd.users[i]; break; } }
      if(!me) return;
      var av = document.querySelector('.admin-card .av');
      var nm = document.querySelector('.admin-card .nm');
      var rl = document.querySelector('.admin-card .rl');
      if(av) av.textContent = initialsOf(me);
      if(nm) nm.textContent = me.name || me.email;
      if(rl) rl.textContent = 'Pentadbir';
    }

    // ---------- settings + help views ----------
    function settingsCard(){
      var r = state.roles || {}, me = null;
      if(r.users){ for(var i=0;i<r.users.length;i++){ if(r.users[i].id===r.me){ me=r.users[i]; break; } } }
      var nm = me ? (me.name || me.email) : 'Pentadbir';
      var em = me ? me.email : '';
      var gen = (state.data && state.data.generated_at) ? fmtStamp(state.data.generated_at) : '';
      return '<div class="view-stack" style="max-width:640px">'
        + '<div class="card">'
          + '<div class="card-head"><div><h3>Akaun Pentadbir</h3><div class="ch-sub">Anda log masuk sebagai</div></div></div>'
          + '<div class="set-id"><div class="av" style="background:' + grad(nm) + '">' + esc(initialsOf(me || { email: em })) + '</div>'
            + '<div><div class="u-name">' + esc(nm) + '</div><div class="u-mail">' + esc(em) + '</div></div>'
            + '<span class="role-pill admin" style="margin-left:auto">Admin</span></div>'
        + '</div>'
        + '<div class="card">'
          + '<div class="card-head"><div><h3>Paparan</h3><div class="ch-sub">Tukar antara paparan Admin dan paparan Pengguna</div></div></div>'
          + '<p class="set-note">Anda kini dalam <b>Paparan Admin</b>. Buka aplikasi sebagai pengguna biasa untuk melihat pengalaman mereka — butang <b>“Panel Admin”</b> akan muncul di dalam aplikasi untuk kembali ke sini.</p>'
          + '<a class="set-btn primary" href="/mathurat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg> Lihat sebagai Pengguna</a>'
        + '</div>'
        + '<div class="card">'
          + '<div class="card-head"><div><h3>Sesi</h3><div class="ch-sub">' + (gen ? ('Data dikemas kini: ' + esc(gen)) : 'Log keluar daripada akaun pentadbir') + '</div></div></div>'
          + '<button class="set-btn danger" id="logoutBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg> Log Keluar</button>'
        + '</div>'
      + '</div>';
    }

    function helpCard(){
      function row(t, d){ return '<div class="help-row"><div class="help-q">' + t + '</div><div class="help-a">' + d + '</div></div>'; }
      return '<div class="view-stack" style="max-width:720px"><div class="card">'
        + '<div class="card-head"><div><h3>Bantuan — Panel Admin</h3><div class="ch-sub">Panduan ringkas</div></div></div>'
        + row('Dashboard', 'Ringkasan KPI, senarai pengguna &amp; kemajuan, serta carta ringkas di sebelah.')
        + row('Pengguna', 'Senarai penuh pengguna &amp; kemajuan, plus <b>Pengurusan Peranan</b> untuk melantik / menarik akses pentadbir.')
        + row('Al-Ma\'thurat', 'Fokus kemajuan wirid Sughra &amp; Kubra setiap pengguna, dengan carta sesi mingguan.')
        + row('Analitik', 'Sesi wirid 7 hari, kaedah log masuk, dan ranking streak tertinggi.')
        + row('Lihat sebagai Pengguna', 'Klik butang di bar atas (atau dalam Tetapan) untuk membuka aplikasi seperti pengguna biasa. Butang <b>“Panel Admin”</b> di dalam aplikasi membawa anda kembali.')
        + row('Peranan', 'Admin boleh melantik pengguna lain (SSO atau e-mel) sebagai pentadbir. Anda tidak boleh menukar peranan akaun sendiri.')
        + '</div></div>';
    }

    function wireSettings(){
      var lo = document.getElementById('logoutBtn');
      if(lo) lo.addEventListener('click', function(){
        lo.disabled = true; lo.style.opacity = '.6';
        fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
          .then(function(){ window.location.href = '/login'; })
          .catch(function(){ window.location.href = '/login'; });
      });
    }

    // ---------- views ----------
    var VIEWS = {
      dashboard: { title: 'Dashboard',          sub: 'Pantau log masuk pengguna &amp; kemajuan bacaan Al-Ma\'thurat secara terperinci' },
      pengguna:  { title: 'Pengguna &amp; Peranan', sub: 'Senarai pengguna berdaftar, kemajuan, dan pengurusan akses pentadbir' },
      mathurat:  { title: 'Al-Ma\'thurat',       sub: 'Kemajuan bacaan wirid Sughra &amp; Kubra bagi setiap pengguna' },
      analitik:  { title: 'Analitik',            sub: 'Sesi wirid mingguan, kaedah log masuk &amp; ranking streak' },
      tetapan:   { title: 'Tetapan',             sub: 'Tukar paparan, log keluar &amp; maklumat akaun pentadbir' },
      bantuan:   { title: 'Bantuan',             sub: 'Panduan ringkas menggunakan Panel Admin Cakna' }
    };

    function viewHTML(v){
      var data = state.data || {}, roles = state.roles || { users: [], me: null };
      if(v === 'pengguna') return '<div class="view-stack">' + tableCard() + rolesCard(roles) + '</div>';
      if(v === 'mathurat') return '<div class="view-stack">' + tableCard() + weeklyCard(data.weekly || []) + '</div>';
      if(v === 'analitik') return '<section class="charts3">' + weeklyCard(data.weekly || []) + splitCard(data.login_split || {}) + rankCard(data.streak_leaders || []) + '</section>';
      if(v === 'tetapan')  return settingsCard();
      if(v === 'bantuan')  return helpCard();
      return kpiSection(data.kpis || {}, data) + gridSection(data);   // dashboard
    }

    function renderView(){
      var v = state.view || 'dashboard';
      content.innerHTML = viewHTML(v);
      if(document.getElementById('u-body')) renderTable();
      if(content.querySelector('.chip')) wireChips();
      wireRoles();
      wireSettings();
      var meta = VIEWS[v] || VIEWS.dashboard;
      var t = document.getElementById('pageTitle'), s = document.getElementById('pageSub');
      if(t) t.innerHTML = meta.title;
      if(s) s.innerHTML = meta.sub;
      var sb = document.querySelector('.searchbox');
      if(sb) sb.style.display = (v === 'tetapan' || v === 'bantuan' || v === 'analitik') ? 'none' : '';
      var navs = document.querySelectorAll('.nav-item[data-view]');
      for(var i = 0; i < navs.length; i++){ navs[i].classList.toggle('active', navs[i].getAttribute('data-view') === v); }
      if(roleFlash){ showRoleMsg(roleFlash.text, roleFlash.err); roleFlash = null; }
    }

    function setView(v){
      if(!v) return;
      state.view = v;
      renderView();
      try { document.scrollingElement.scrollTop = 0; } catch(e){}
    }

    function wireNav(){
      var navs = document.querySelectorAll('.nav-item[data-view]');
      for(var i = 0; i < navs.length; i++){
        (function(a){ a.addEventListener('click', function(e){ e.preventDefault(); setView(a.getAttribute('data-view')); }); })(navs[i]);
      }
      var cog = document.getElementById('cogBtn');
      if(cog) cog.addEventListener('click', function(){ setView('tetapan'); });
    }

    // ---------- top-level render ----------
    function render(data, roles){
      state.data = data;
      state.roles = roles || { users: [], me: null };
      state.ref = data.generated_at || null;
      if(!state.view) state.view = 'dashboard';
      state.selectedId = (data.users && data.users.length) ? data.users[0].id : null;
      renderView();
      updateAdminIdentity(state.roles);
      updateFooter(data.generated_at);
      var nc = document.getElementById('navUserCount');
      if (nc && data.kpis) nc.textContent = nf(data.kpis.total_users);
    }

    // ---------- states ----------
    function showLoading(){
      content.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:52vh;color:var(--text-soft)">'
        + '<div style="width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--gold);animation:cakspin .8s linear infinite"></div>'
        + '<div style="font-size:14px">Memuatkan data…</div></div>';
    }

    function showAuth(){
      content.innerHTML = '<div style="min-height:56vh;display:grid;place-items:center;padding:24px">'
        + '<div class="card" style="max-width:420px;width:100%;text-align:center;padding:34px 30px">'
          + '<div style="width:56px;height:56px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(199,162,75,.16),rgba(199,162,75,.05));border:1px solid rgba(199,162,75,.32);color:var(--gold-dk)">'
            + '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>'
          + '</div>'
          + '<h3 class="serif" style="font-size:20px;margin-bottom:8px">Akses admin diperlukan</h3>'
          + '<p style="color:var(--text-soft);font-size:13.5px;margin-bottom:22px;line-height:1.55">Sila log masuk sebagai pentadbir.</p>'
          + '<a href="/login" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 26px;border-radius:12px;background:var(--emerald);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow-sm)">Log masuk</a>'
        + '</div></div>';
    }

    function showError(){
      content.innerHTML = '<div style="min-height:56vh;display:grid;place-items:center;padding:24px">'
        + '<div class="card" style="max-width:420px;width:100%;text-align:center;padding:34px 30px">'
          + '<div style="width:56px;height:56px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;background:rgba(198,122,46,.12);border:1px solid rgba(198,122,46,.28);color:var(--amber)">'
            + '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 16.5h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'
          + '</div>'
          + '<h3 class="serif" style="font-size:20px;margin-bottom:8px">Gagal memuatkan data</h3>'
          + '<p style="color:var(--text-soft);font-size:13.5px;margin-bottom:22px;line-height:1.55">Sambungan terganggu atau pelayan tidak memberi respons.</p>'
          + '<button id="retry-btn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 26px;border-radius:12px;background:var(--emerald);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow-sm)">Cuba semula</button>'
        + '</div></div>';
      var b = document.getElementById('retry-btn');
      if(b) b.addEventListener('click', load);
    }

    // ---------- data load ----------
    function load(){
      showLoading();
      var opt = { credentials: 'same-origin', headers: { 'Accept': 'application/json' } };
      Promise.all([ fetch('/api/admin/overview', opt), fetch('/api/admin/users', opt) ])
        .then(function(rs){
          var ov = rs[0], us = rs[1];
          if([ov.status, us.status].indexOf(401) > -1 || [ov.status, us.status].indexOf(403) > -1){ showAuth(); return null; }
          if(!ov.ok){ throw new Error('overview HTTP ' + ov.status); }
          if(!us.ok){ throw new Error('users HTTP ' + us.status); }
          return Promise.all([ov.json(), us.json()]);
        })
        .then(function(arr){ if(arr) render(arr[0], arr[1]); })
        .catch(function(err){ console.error('Cakna admin load failed:', err); showError(); });
    }

    // live date in the top bar (was hardcoded sample text in the mockup)
    (function(){
      var el = document.querySelector('.date-pill');
      if(!el) return;
      var DAYS = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
      var d = new Date(), icon = el.querySelector('svg');
      el.textContent = '';
      if(icon) el.appendChild(icon);
      el.appendChild(document.createTextNode(' ' + DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear()));
    })();

    // wire persistent chrome (sidebar nav + cog, search box) — done once
    wireNav();
    (function(){
      var si = document.getElementById('searchInput');
      if(si) si.addEventListener('input', function(){
        state.search = si.value || '';
        if(document.getElementById('u-body')) renderTable();
      });
    })();

    load();
  })();
</script>
</body>
</html>
