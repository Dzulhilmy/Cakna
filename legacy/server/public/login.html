<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B3D2E" />
  <meta name="description" content="Log masuk ke Cakna — Mushaf Digital. Teruskan bacaan, hafazan dan ibadah anda." />
  <link rel="icon" href="/favicon.png" />
  <title>Log Masuk — Cakna</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --emerald-deep:#0B3D2E;
      --emerald:#155B44;
      --emerald-soft:#1B6B51;
      --gold:#C7A24B;
      --gold-soft:#E3CD96;
      --cream:#F7F3E8;
      --surface:#FFFDF7;
      --text:#22312B;
      --muted:#5C6B63;
      --border:#E4DCC8;
      --danger:#B4432E;
      --danger-bg:#FBEDE8;
      --radius-card:24px;
      --radius-ctrl:13px;
      --shadow-card:0 28px 60px -30px rgba(11,61,46,.42), 0 4px 14px -8px rgba(11,61,46,.14);
      --ring:0 0 0 3px rgba(21,91,68,.16);
      --ring-gold:0 0 0 3px rgba(199,162,75,.40);
      font-family:"Figtree", system-ui, -apple-system, sans-serif;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background:var(--cream);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    /* --- Full-height stage with a calm emerald + gold wash --- */
    .stage{
      position:relative;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:28px 18px calc(28px + env(safe-area-inset-bottom));
      overflow:hidden;
      isolation:isolate;
    }
    .stage::before{
      /* soft emerald glow from the top */
      content:"";
      position:absolute; inset:0; z-index:-2;
      background:
        radial-gradient(130% 70% at 50% -12%, rgba(11,61,46,.16), rgba(11,61,46,0) 58%),
        radial-gradient(90% 55% at 88% 108%, rgba(199,162,75,.14), rgba(199,162,75,0) 60%),
        var(--cream);
    }
    .stage::after{
      /* faint editorial hairline texture, very subtle */
      content:"";
      position:absolute; inset:0; z-index:-1;
      background-image:radial-gradient(rgba(11,61,46,.05) 1px, transparent 1px);
      background-size:22px 22px;
      -webkit-mask-image:radial-gradient(120% 80% at 50% 40%, #000 20%, transparent 75%);
      mask-image:radial-gradient(120% 80% at 50% 40%, #000 20%, transparent 75%);
      opacity:.5;
      pointer-events:none;
    }

    /* --- Card --- */
    .card{
      position:relative;
      width:100%;
      max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-card);
      box-shadow:var(--shadow-card);
      padding:34px 30px 28px;
      animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
    }
    .card::before{
      /* gold hairline seam at the very top edge of the card */
      content:"";
      position:absolute; left:26px; right:26px; top:0; height:2px;
      border-radius:0 0 3px 3px;
      background:linear-gradient(90deg, transparent, var(--gold-soft), var(--gold), var(--gold-soft), transparent);
      opacity:.85;
    }
    @keyframes rise{
      from{ opacity:0; transform:translateY(14px) scale(.985); }
      to{ opacity:1; transform:none; }
    }

    /* --- Brand --- */
    .brand{ text-align:center; margin-bottom:22px; }
    .mark{
      color:var(--gold);
      width:52px; height:52px;
      margin:0 auto 12px;
      display:flex; align-items:center; justify-content:center;
      filter:drop-shadow(0 4px 10px rgba(199,162,75,.30));
    }
    .mark svg{ width:52px; height:52px; }
    .wordmark{
      font-family:"Marcellus", serif;
      font-size:34px;
      line-height:1;
      letter-spacing:.5px;
      color:var(--emerald-deep);
    }
    .tagline{
      margin-top:8px;
      font-size:11px;
      font-weight:600;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--gold);
    }
    .brand-rule{
      width:44px; height:1px;
      margin:16px auto 0;
      background:linear-gradient(90deg, transparent, var(--border), transparent);
    }

    /* --- Heading --- */
    .head{ text-align:center; margin:20px 0 22px; }
    .head h1{
      font-family:"Marcellus", serif;
      font-weight:400;
      font-size:23px;
      margin:0 0 6px;
      color:var(--emerald-deep);
      letter-spacing:.2px;
    }
    .head p{
      margin:0;
      font-size:14.5px;
      color:var(--muted);
      line-height:1.5;
    }

    /* --- QCXIS primary action (the dominant, trusted option) --- */
    .sso{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      width:100%;
      min-height:56px;
      padding:15px 18px;
      border:0;
      border-radius:var(--radius-ctrl);
      background:linear-gradient(180deg, var(--emerald-soft), var(--emerald) 45%, var(--emerald-deep));
      color:#fff;
      font-family:inherit;
      font-size:16px;
      font-weight:600;
      letter-spacing:.2px;
      text-decoration:none;
      cursor:pointer;
      box-shadow:0 14px 26px -14px rgba(11,61,46,.6), inset 0 1px 0 rgba(255,255,255,.14);
      transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    .sso:hover{ transform:translateY(-1px); box-shadow:0 18px 30px -14px rgba(11,61,46,.66), inset 0 1px 0 rgba(255,255,255,.18); filter:saturate(1.04); }
    .sso:active{ transform:translateY(0); }
    .sso:focus-visible{ outline:none; box-shadow:var(--ring-gold), 0 14px 26px -14px rgba(11,61,46,.6); }
    .sso svg{ width:21px; height:21px; flex:none; }
    .sso-sub{
      text-align:center;
      margin:10px 0 0;
      font-size:12.5px;
      color:var(--muted);
    }

    /* --- Divider --- */
    .divider{
      display:flex; align-items:center; gap:14px;
      margin:22px 0;
      color:var(--muted);
    }
    .divider::before, .divider::after{
      content:""; flex:1; height:1px;
      background:linear-gradient(90deg, transparent, var(--border) 45%, var(--border) 55%, transparent);
    }
    .divider span{
      font-size:11.5px;
      font-weight:600;
      letter-spacing:2.5px;
      text-transform:uppercase;
    }

    /* --- Form --- */
    form{ margin:0; }
    .field{ margin-bottom:15px; }
    .field label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:600;
      color:var(--text);
      letter-spacing:.2px;
    }
    .control{ position:relative; }
    input[type="email"],
    input[type="password"],
    input[type="text"]{
      width:100%;
      padding:13px 14px;
      font-family:inherit;
      font-size:15px;
      color:var(--text);
      background:var(--cream);
      border:1px solid var(--border);
      border-radius:var(--radius-ctrl);
      transition:border-color .16s ease, box-shadow .16s ease, background .16s ease;
      -webkit-appearance:none;
      appearance:none;
    }
    .control:has(.pw-toggle) input{ padding-right:46px; }
    input::placeholder{ color:#9AA79F; }
    input:focus{
      outline:none;
      border-color:var(--emerald);
      background:var(--surface);
      box-shadow:var(--ring);
    }
    input[aria-invalid="true"]{
      border-color:var(--danger);
      box-shadow:0 0 0 3px rgba(180,67,46,.14);
    }

    .pw-toggle{
      position:absolute; top:50%; right:8px;
      transform:translateY(-50%);
      display:flex; align-items:center; justify-content:center;
      width:34px; height:34px;
      padding:0; border:0; border-radius:9px;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      transition:color .16s ease, background .16s ease;
    }
    .pw-toggle:hover{ color:var(--emerald); background:rgba(21,91,68,.06); }
    .pw-toggle:focus-visible{ outline:none; box-shadow:var(--ring); color:var(--emerald); }
    .pw-toggle svg{ width:19px; height:19px; }
    .pw-toggle .icon-off{ display:none; }
    .pw-toggle[data-visible="true"] .icon-on{ display:none; }
    .pw-toggle[data-visible="true"] .icon-off{ display:block; }

    /* --- Error --- */
    .error{
      display:none;
      align-items:center;
      gap:8px;
      margin:2px 0 4px;
      padding:10px 12px;
      font-size:13px;
      line-height:1.4;
      color:var(--danger);
      background:var(--danger-bg);
      border:1px solid rgba(180,67,46,.22);
      border-radius:10px;
    }
    .error.show{ display:flex; animation:shake .32s ease; }
    .error svg{ width:16px; height:16px; flex:none; }
    @keyframes shake{
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-4px); }
      40%{ transform:translateX(4px); }
      60%{ transform:translateX(-3px); }
      80%{ transform:translateX(3px); }
    }

    /* --- Secondary submit (subordinate to the QCXIS button) --- */
    .login-btn{
      position:relative;
      width:100%;
      min-height:52px;
      margin-top:6px;
      padding:14px 18px;
      font-family:inherit;
      font-size:15.5px;
      font-weight:600;
      letter-spacing:.2px;
      color:var(--emerald-deep);
      background:rgba(21,91,68,.05);
      border:1.5px solid var(--emerald);
      border-radius:var(--radius-ctrl);
      cursor:pointer;
      transition:background .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .login-btn:hover{ background:var(--emerald); color:#fff; }
    .login-btn:active{ transform:translateY(1px); }
    .login-btn:focus-visible{ outline:none; box-shadow:var(--ring); }
    .login-btn[aria-busy="true"]{ color:transparent; cursor:progress; background:rgba(21,91,68,.05); }
    .login-btn[aria-busy="true"]::after{
      content:"";
      position:absolute; top:50%; left:50%;
      width:19px; height:19px; margin:-9.5px 0 0 -9.5px;
      border:2.5px solid rgba(21,91,68,.28);
      border-top-color:var(--emerald);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* --- Register --- */
    .register{
      text-align:center;
      margin:20px 0 4px;
      font-size:14px;
      color:var(--muted);
    }
    .register a{
      color:var(--emerald);
      font-weight:600;
      text-decoration:none;
      border-bottom:1px solid transparent;
      transition:border-color .16s ease;
    }
    .register a:hover{ border-bottom-color:var(--emerald); }
    .register a:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:4px; }

    /* --- Footer trust note --- */
    .secure{
      display:flex; align-items:center; justify-content:center; gap:6px;
      margin-top:22px;
      font-size:11.5px;
      color:var(--muted);
      opacity:.85;
    }
    .secure svg{ width:13px; height:13px; }

    @media (max-width:400px){
      .card{ padding:28px 22px 24px; border-radius:20px; }
      .wordmark{ font-size:30px; }
      .head h1{ font-size:21px; }
    }

    @media (prefers-reduced-motion:reduce){
      *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
      .login-btn[aria-busy="true"]::after{ animation:spin 1.2s linear infinite; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="pageTitle">
      <!-- Brand -->
      <header class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M22 2 l5.9 8.2 9.6 2.4 -6.2 7.7 .7 9.9 -10 -3.7 -10 3.7 .7 -9.9 -6.2 -7.7 9.6 -2.4 Z"/>
            <circle cx="22" cy="18" r="5.5"/>
            <path d="M13 36 h18 M16 41 h12" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="wordmark">Cakna</div>
        <div class="tagline">Mushaf Digital</div>
        <div class="brand-rule" aria-hidden="true"></div>
      </header>

      <!-- Heading -->
      <div class="head">
        <h1 id="pageTitle">Selamat datang</h1>
        <p>Log masuk untuk meneruskan bacaan anda.</p>
      </div>

      <!-- Primary: QCXIS SSO -->
      <a class="sso" id="ssoBtn" href="/auth/sso/start">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 4.5 6v5.5c0 4.3 3.2 7.5 7.5 8.5 4.3-1 7.5-4.2 7.5-8.5V6L12 3Z"/>
          <circle cx="12" cy="10.4" r="2"/>
          <path d="M12 12.4v3.1"/>
        </svg>
        <span>Teruskan dengan QCXIS</span>
      </a>
      <p class="sso-sub">Log masuk dengan akaun QCXIS anda</p>

      <!-- Divider -->
      <div class="divider"><span>atau</span></div>

      <!-- Secondary: email + password -->
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Emel</label>
          <div class="control">
            <input id="email" name="email" type="email" inputmode="email"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   placeholder="nama@contoh.com" aria-describedby="formError" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Kata laluan</label>
          <div class="control">
            <input id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="Kata laluan anda"
                   aria-describedby="formError" required />
            <button type="button" class="pw-toggle" id="pwToggle" data-visible="false"
                    aria-label="Tunjuk kata laluan">
              <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/>
                <path d="M10.6 6.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a15.9 15.9 0 0 1-3.4 4.3M6.5 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4-.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="error" id="formError" role="alert" aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>
          </svg>
          <span id="formErrorText"></span>
        </p>

        <button type="submit" class="login-btn" id="submitBtn">Log masuk</button>
      </form>

      <!-- Register -->
      <p class="register">Belum ada akaun? <a href="/auth/register">Daftar</a></p>

      <div class="secure" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
        <span>Sambungan disulitkan &amp; selamat</span>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var emailEl = document.getElementById('email');
      var pwEl = document.getElementById('password');
      var errBox = document.getElementById('formError');
      var errText = document.getElementById('formErrorText');
      var submitBtn = document.getElementById('submitBtn');
      var pwToggle = document.getElementById('pwToggle');

      var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

      function showError(msg) {
        errText.textContent = msg;
        errBox.classList.remove('show');
        // reflow so the shake animation re-triggers on repeated errors
        void errBox.offsetWidth;
        errBox.classList.add('show');
      }
      function clearError() {
        errBox.classList.remove('show');
        errText.textContent = '';
        emailEl.removeAttribute('aria-invalid');
        pwEl.removeAttribute('aria-invalid');
      }
      function setLoading(on) {
        if (on) {
          submitBtn.setAttribute('aria-busy', 'true');
          submitBtn.disabled = true;
        } else {
          submitBtn.removeAttribute('aria-busy');
          submitBtn.disabled = false;
        }
      }

      // Show / hide password
      pwToggle.addEventListener('click', function () {
        var reveal = pwEl.type === 'password';
        pwEl.type = reveal ? 'text' : 'password';
        pwToggle.dataset.visible = reveal ? 'true' : 'false';
        pwToggle.setAttribute('aria-label', reveal ? 'Sembunyikan kata laluan' : 'Tunjuk kata laluan');
        pwEl.focus();
      });

      // Clear errors as the user corrects input
      emailEl.addEventListener('input', clearError);
      pwEl.addEventListener('input', clearError);

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        clearError();

        var email = emailEl.value.trim();
        var password = pwEl.value;

        // Client-side validation (Malay)
        if (!EMAIL_RE.test(email)) {
          emailEl.setAttribute('aria-invalid', 'true');
          showError('Sila masukkan alamat emel yang sah.');
          emailEl.focus();
          return;
        }
        if (!password) {
          pwEl.setAttribute('aria-invalid', 'true');
          showError('Sila masukkan kata laluan anda.');
          pwEl.focus();
          return;
        }

        setLoading(true);
        try {
          var res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email: email, password: password })
          });

          if (res.ok) {
            var next = new URLSearchParams(location.search).get('next');
            window.location.href = (next && next.charAt(0) === '/' && next.charAt(1) !== '/') ? next : '/mathurat';
            return;
          } else {
            var data = await res.json().catch(function () { return {}; });
            showError(data.error || 'Log masuk gagal');
          }
        } catch (err) {
          showError('Ralat sambungan. Sila cuba lagi.');
        }
        setLoading(false);
      });
    })();
  </script>
  <script>
    // forward a ?next= return path through the QCXIS SSO button too
    (function () {
      var next = new URLSearchParams(location.search).get('next');
      var btn = document.getElementById('ssoBtn');
      if (btn && next && next.charAt(0) === '/' && next.charAt(1) !== '/') {
        btn.href = '/auth/sso/start?next=' + encodeURIComponent(next);
      }
    })();
  </script>
</body>
</html>
